name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/wedding
      DIRECT_URL: postgresql://user:password@localhost:5432/wedding
      ADMIN_PASSWORD: ci-admin-password
      SUPER_ADMIN_PASSWORD: ci-super-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
